name: Build and Publish

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Open VSXのTrusted Publishers (OIDC) 認証に必須やで！
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Compile and Package
        run: |
          npm run compile
          npx @vscode/vsce package --no-dependencies

      - name: Publish to Open VSX
        uses: open-vsx/publish-action@v2
        with:
          extension-file: '*.vsix'
          namespace: Ringo3Apples
          extension-id: vtu-viewer
